[package]
name = "fleet-cli"
description = "The `fleet` binary: command line, terminal dashboard and daemon entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "fleet_cli"
path = "src/lib.rs"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
fleet-domain = { path = "../fleet-domain" }
fleet-app = { path = "../fleet-app" }
fleet-infra = { path = "../fleet-infra" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
nix = { version = "=0.31.3", default-features = false, features = ["poll", "user"] }

[lints]
workspace = true
