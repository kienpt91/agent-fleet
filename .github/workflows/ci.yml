name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # pinned to a full commit SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        # the runner's preinstalled rustup installs the pinned toolchain and components
        run: rustup show active-toolchain || rustup toolchain install
      - name: Git identity for tests that create repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned to a full commit SHA; full history so the whole history can be scanned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the tree
        run: sh scripts/secret-scan.sh --tree
      - name: Scan the history
        run: sh scripts/secret-scan.sh --history
