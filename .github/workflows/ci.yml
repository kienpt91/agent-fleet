name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # pinned to a full commit SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        # the runner's preinstalled rustup installs the pinned toolchain and components
        run: rustup show active-toolchain || rustup toolchain install
      - name: Git identity for tests that create repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked

  ssh-tests:
    # The tests against a real OpenSSH server (host key pinning, quoting, kill escalation, verification of
    # what a host returns). FLEET_SSH_TESTS=1 (set by scripts/ssh-env.sh) makes a missing server a failure
    # instead of a skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: OpenSSH server and client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client
      - name: Git identity for tests that create repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: cargo fetch --locked
      - run: sh scripts/ssh-env.sh cargo test --locked -p fleet-infra --test ssh_remote
      - run: sh scripts/ssh-env.sh cargo test --locked -p fleet-cli --test e2e_remote

  dogfood-shell:
    # The shell tests of the checker scripts of dogfood/ (check-protected.sh and the others are the second judge in
    # every self-development contract). They need only git and a POSIX shell; read-only permissions, no secrets.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned to a full commit SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sh dogfood/tests/run.sh

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned to a full commit SHA; full history so the whole history can be scanned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the tree
        run: sh scripts/secret-scan.sh --tree
      - name: Scan the history
        run: sh scripts/secret-scan.sh --history

  release-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-release.sh
