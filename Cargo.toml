[workspace]
resolver = "2"
members = [
  "crates/fleet-domain",
  "crates/neo-verify",
  "crates/neo-goals",
  "crates/neo-context",
  "crates/fleet-forge",
  "crates/fleet-fanout",
  "crates/fleet-app",
  "crates/fleet-infra",
  "crates/fleet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kienpt91/agent-fleet"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
