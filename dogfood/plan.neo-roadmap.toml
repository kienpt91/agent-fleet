[[tasks]]
id = "n3-fact"
title = "N3: the Fact value object and its status machine (fact.rs)"
worker = "agent"
after = ["n3-source"]
spec = '''
Implement crates/neo-knowledge/src/fact.rs on top of source.rs.

A `Fact` has an id, a bounded claim text, a subject key and value (the pair used to find
contradictions), a scope (global, project, run, task), tags, a `Source`, a status (proposed, verified,
rejected, superseded, stale), a `supersedes` link and the file hash a file-bound fact depends on.
Write the constructor with validation, and the status machine as a pure function table:
proposed to verified or rejected; verified to superseded or stale; stale to verified or rejected;
nothing leaves rejected or superseded. A fact becomes verified only when the caller names a verification
rule: an executed check, a citation that was mechanically confirmed, or a human approval; an agent
assertion alone can never produce verified (test it for every source kind).

Tests: every legal and every illegal transition; claims over the bound are refused; hostile text
(control characters, bidi overrides) is refused. Change ONLY crates/neo-knowledge/src/fact.rs.
Standard library and fleet-domain only, no unsafe, no unwrap/expect/indexing outside tests, no I/O.

You cannot run commands in this setup (no build, no test run): edit the named file with care. Commit nothing yourself: fleet commits your work and runs every check itself.
'''

