title = "N3: fact sources and the confidence they give (source.rs)"
worker = "agent"
after = ["n3-scaffold"]
spec = '''
Implement crates/neo-knowledge/src/source.rs.

A fact's source is one of: a file citation (path, commit, line range, SHA-256 of the cited lines), the
id of the evidence of an executed check, a URL with its retrieval date and content hash, or a human.
Write: the `Source` enum with validation (bounded lengths, relative paths without `..`, lowercase hex
