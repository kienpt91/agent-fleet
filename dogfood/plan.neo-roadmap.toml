[[tasks]]
id = "n5-account"
title = "N5: accounts, leases and assignment policies (account.rs)"
worker = "agent"
after = ["n5-refs"]
spec = '''
Implement crates/neo-broker/src/account.rs: `Account` (id, label, a `CredentialRef`, an optional owner
note), `Lease` (account, task, expiry as a number the caller supplies) and a `Pool` with the assignment
policies round robin, least used and pinned per task. Deterministic: the same sequence of requests
gives the same assignments. A released or expired lease frees its account for the next request. A
lease is never granted to two tasks at once for an account marked exclusive.

State clearly in the module comment that the pool assigns the owner's own accounts and keys only; it
has no notion of rotating identities to get around a provider's limits and none may be added.
Tests for each policy, expiry, exclusivity and determinism. Change ONLY crates/neo-broker/src/account.rs.
