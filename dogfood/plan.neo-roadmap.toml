`Display` that is stable, and `Confidence` (executed check, then file citation, then URL, then human
assertion, then agent assertion) with `Source::confidence()`; an agent assertion is a source kind too
(`Agent { task }`). Property-style tests with a deterministic generator: every valid source round-trips
through its canonical text; random strings never panic the constructor.

Change ONLY crates/neo-knowledge/src/source.rs. Standard library and fleet-domain only, no unsafe, no
unwrap/expect/indexing outside tests, no I/O, no clock.

You cannot run commands in this setup (no build, no test run): edit the named file with care. Commit nothing yourself: fleet commits your work and runs every check itself.
