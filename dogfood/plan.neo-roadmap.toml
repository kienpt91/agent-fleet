[[tasks]]
id = "n5-capability"
title = "N5: scoped, revocable lease capabilities (capability.rs)"
worker = "agent"
after = ["n5-account"]
spec = '''
Implement crates/neo-broker/src/capability.rs: a `Capability` bound to one lease with a set of
allowed model names, a token budget and an expiry, and `check(request) -> Allow | Deny(reason)`. Revocation
is a set of lease ids; a revoked, expired, over-budget or out-of-scope request is denied with a reason
that never contains a credential reference or anything else from the account. The capability value
itself is an opaque handle (a bounded random-looking string supplied by the caller): it never derives
from, embeds or reveals a `CredentialRef`, and the context pack digest of a task does not depend on the
account (test: two leases of different accounts for the same task give the same task-visible data).

